<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password | Electra</title>
  <link rel="stylesheet" href="../css/style.css">
  <script defer src="../js/main.js"></script>
  <script defer src="../js/forgot-password.js"></script>
</head>
<body>
  <header class="site-header">
    <div class="nav-wrap">
      <a class="brand" href="index.html">
        <span class="brand-mark">✓</span>
        <span>Electra<br><small>Election Management</small></span>
      </a>
      <nav class="nav-links">
        <a href="index.html">Home</a>
        <a href="login.html">Login</a>
      </nav>
    </div>
  </header>

  <main>
    <section class="page-title">
      <h1>Forgot password?</h1>
      <p class="muted">Enter your registered email to begin the reset process.</p>
    </section>

    <section class="panel">
      <form id="forgot-password-form">
        <div class="field">
          <label for="email">Registered email</label>
          <input id="email" name="email" type="email"
            required autocomplete="email" placeholder="name@example.com">
        </div>

        <div class="form-actions">
          <button class="btn" type="submit">Request reset</button>
          <a class="btn btn-secondary" href="login.html">Back to login</a>
        </div>
      </form>

      <p class="help" style="margin-top:18px">
        The frontend cannot send reset emails. This requires a backend
        and a secure, time-limited reset token.
      </p>
    </section>
  </main>

  <footer class="site-footer">
    <div class="footer-inner">
      <span>Electra · Academic DBMS project</span>
      <span>Frontend demonstration only</span>
    </div>
  </footer>
</body>
</html>
